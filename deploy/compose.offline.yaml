# Apply only for isolated Phase 7 blocked-egress acceptance, after provisioning.
services:
  api:
    networks: [phase7_offline]
    environment:
      PRIVATE_INFERENCE_QUEUE_WAIT_SECONDS: "60"
    depends_on:
      database: {condition: service_started}
      odoo: {condition: service_started}
      ollama: {condition: service_started}
    volumes:
      - ../scripts:/app/scripts:ro
      - ../local/phase-7/atlas-restore-scan.pdf:/app/fixtures/atlas-restore-scan.pdf:ro
      - ../evaluation/heldout-v6:/app/evaluation/heldout-v6:ro
  database:
    networks: [phase7_offline]
  odoo:
    networks: [phase7_offline]
  ollama:
    profiles: [full-stack]
    image: python:3.12-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
    entrypoint: ["/opt/ollama/bin/ollama"]
    command: ["serve"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11439
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "0"
      HOME: /tmp
    volumes:
      - ../local/phase-7/ollama-full:/opt/ollama:ro
      - project07-ollama-models:/models
    networks: [phase7_offline]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 4096m
    cpus: 4
    gpus: all
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  phase7_offline:
    internal: true
volumes:
  project07-ollama-models:
    external: true
    name: private-documents-phase7_project07-ollama-models
